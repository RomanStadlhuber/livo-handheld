backend:
  sliding_window_size: 7 # [keyframes]
  init_time_window: 2.0 # [sec.]
  solver_iterations: 2 
  isam2_relinearize_threshold: 0.01 # frobenius norm for relinearization on state variables

lidar_frontend:
  voxel_size: 1.0 # [m]
  undistort: true # disable for solid state LiDARs
  knn_radius: 1.5 # [m], NOTE that a larger radius significantly increases search time
  knn_neighbors: 5
  normal_consistency_threshold: 0.8 # [0-1], accepting new points based updated normal consistency
  planarity_check:
    linearity: 0.3
    planarity: 0.3
  clustering:
    min_points: 5
    max_points: 20
    max_plane_thickness: 0.004 # [m]^2, NOTE: needs to be squared, residuals & thickness values are too
    sampling_voxel_size: 2.5 # [m], voxel size to use for cluster supplementation (0 = all)
    insert_lag: 0 # keyframe delay to use when inserting new clusters from keyframes
  keyframe:
    thresh_distance: 0.3 # [m]
    thresh_angle: 0.349 # [rad], ~20 [°]
    thresh_elapsed_scans: 5

camera_frontend:
  color_space: RGB # can be RGB or BGR (both 8-bit)
  colorize_scans: false # if enabled, will colorize points within the image
  sync_tolerance: 0.01 # [sec.], tolerance for syncing images to LiDAR scans
  keepalive_window: 0.6 # [sec.], how long images are kept for sync before being discarded

point_filter:
  min_distance: 2.5 # [m]
  max_distance: 100.0 # [m]

extrinsics:
  temporal_calibration_enabled: false
  extrinsic_calibration_enabled: false
  imu_T_lidar: # initial guess for (or constant) extrinsic IMU-LiDAR calibration
    translation: [-0.011, -0.02329, 0.04412] # [m]
    rotation: [0, 0, 0, 1] # hamilton quaternion (x, y, z, w)
  imu_t_lidar: 0.0 # initial guess for (or constant) temporal IMU-LiDAR offset
  imu_T_camera:
    translation: [0.0491,  -0.02329, -0.00188]
    rotation: [0.40558601, -0.40558601,  0.57922361, -0.57922361] # (x, y, z, w)
    
intrinsics:
  camera:
    model: "PinholeRadTan" # or "PinholeEquidistant", but not supported yet
    pinhole_parameters: # 640x480
      fx: 807.406
      fy: 806.768
      cx: 327.545
      cy: 233.247
    distortion_coefficients:
      - -0.501859
      - 0.270368
      - 0.000114465
      - -0.00185591

bundle_adjustment:
  submap_min_distance: 1.0      # [m], min travel from last accepted submap
  submap_min_angle: 0.4       # [rad], min rotation from last accepted submap
  # IMPORTANT: should be larger than frontend voxel size!!
  icp_max_correspondence_distance: 1.5  # [m]
  icp_iterations: 3
  refinement_voxel_size: 0.2    # [m]
  loop_closure_search_radius: 15.0  # [m], max centroid distance for non-sequential loop closure
  loop_closure_min_fitness: 0.6
  convergence_pose_delta_translation: 0.02 # [m]
  convergence_pose_delta_rotation: 0.01    # [rad]
  max_align_iterations: 5
  scan_to_map_registration:
    aabb_inflation_margin: 0.25  # [m], compensates for odometry drift at submap boundaries
    max_candidates: 5
    cache_voxel_size: 0.15       # [m], voxel size for the merged reference map
    voxel_sizes: [0.4, 0.2, -1.0]                 # [m] per ICP scale, strictly decreasing, -1 = original
    max_correspondence_distances: [1.0, 0.5, 0.2] # [m] per ICP scale
    max_iterations_per_scale: [30, 15, 10]
    fitness_threshold: 0.2       # min inlier ratio to accept registration result

